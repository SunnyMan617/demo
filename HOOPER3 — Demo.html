<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOOPER3 — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  :root{
    --ink:#14151A;
    --surface:#1C1E26;
    --surface-2:#242733;
    --line:#32353F;
    --paper:#F3F1EA;
    --paper-dim:#C9C7C0;
    --orange:#FF5A1F;
    --orange-dim:#7A3119;
    --cyan:#2FD4C4;
    --amber:#FFB020;
    --red:#FF5470;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme: dark; } }
  :root[data-theme="dark"]{ color-scheme: dark; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
  ::selection{background:var(--orange); color:#14151A;}
  .court-rule{
    background-image: repeating-linear-gradient(90deg, var(--orange) 0 26px, transparent 26px 40px);
    height:3px; opacity:.55; border-radius:3px;
  }
  .scrollbar-thin::-webkit-scrollbar{height:6px; width:6px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .tab-btn{transition:color .15s ease, background-color .15s ease;}
  .tab-btn[data-active="true"]{background:var(--surface-2); color:var(--paper);}
  .tab-btn[data-active="false"]{color:var(--paper-dim);}
  .tab-btn:hover[data-active="false"]{color:var(--paper); background:var(--surface);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px;}
  .chip{font-size:11px; letter-spacing:.02em; padding:3px 9px; border-radius:999px; font-weight:600;}
  .btn-primary{background:var(--orange); color:#1A0D06; font-weight:600; transition:filter .15s;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--paper);}
  .btn-ghost:hover{background:var(--surface-2);}
  input,select{background:var(--ink); border:1px solid var(--line); color:var(--paper); border-radius:7px;}
  input:focus,select:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan); outline-offset:1px;}
  table{border-collapse:collapse; width:100%;}
  th{font-weight:600; font-size:12px; color:var(--paper-dim); text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);}
  td{padding:9px 10px; border-bottom:1px solid var(--line); font-size:14px;}
  tr:last-child td{border-bottom:none;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
  .fadein{animation:fadein .25s ease both;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .conflict-flash{animation:flash 1.1s ease;}
  @keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(255,80,112,0);} 15%{box-shadow:0 0 0 3px rgba(255,80,112,.55);}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============== DEMO DATA (in-memory only, no database / no backend) ============== */
const DB = {
  org: { name:"Lisboa Streetball Association", plan:"Organização", courts:["Campo A","Campo B","Campo C"] },
  user: { name:"Rita Fonseca", role:"Organizador" },
  tournament: {
    name:"HOOPER3 Open — Primavera",
    dates:"24–25 maio 2026",
    local:"Pavilhão do Restelo, Lisboa",
    categories:[
      { id:"masc-open", name:"Masculino Open", format:"Grupos + eliminatórias", teamsCount:12 },
      { id:"fem-open", name:"Feminino Open", format:"Grupos + eliminatórias", teamsCount:8 },
      { id:"sub18", name:"Sub-18 Misto", format:"Round-robin", teamsCount:6 },
    ]
  },
  teams: [
    { id:1, name:"Alfama Ballers", category:"masc-open", group:"A", checkedIn:true,
      players:[{n:"T. Rocha",num:4},{n:"B. Matos",num:7},{n:"D. Pires",num:11},{n:"J. Costa",num:23}] },
    { id:2, name:"Benfica Street Kings", category:"masc-open", group:"A", checkedIn:true,
      players:[{n:"R. Alves",num:3},{n:"N. Silva",num:9},{n:"P. Ramos",num:14},{n:"H. Dias",num:21}] },
    { id:3, name:"Chelas Ballers Crew", category:"masc-open", group:"A", checkedIn:false,
      players:[{n:"M. Lopes",num:5},{n:"F. Nunes",num:8},{n:"L. Cunha",num:15}] },
    { id:4, name:"Marvila Hoopers", category:"masc-open", group:"B", checkedIn:true,
      players:[{n:"S. Gomes",num:2},{n:"A. Teixeira",num:10},{n:"V. Sousa",num:17},{n:"C. Reis",num:30}] },
    { id:5, name:"Odivelas Runners", category:"masc-open", group:"B", checkedIn:false,
      players:[{n:"J. Martins",num:6},{n:"P. Correia",num:12},{n:"R. Vaz",num:19}] },
    { id:6, name:"Amadora Flow", category:"masc-open", group:"B", checkedIn:true,
      players:[{n:"E. Tavares",num:1},{n:"G. Mendes",num:13},{n:"I. Antunes",num:22}] },
    { id:7, name:"Cascais Wave", category:"fem-open", group:"A", checkedIn:true,
      players:[{n:"M. Vieira",num:4},{n:"A. Pinto",num:9},{n:"L. Baptista",num:14}] },
    { id:8, name:"Sintra Lynx", category:"fem-open", group:"A", checkedIn:true,
      players:[{n:"C. Faria",num:5},{n:"B. Neves",num:10},{n:"D. Moura",num:18}] },
  ],
  courtsSchedule: [
    { id:"g1", category:"masc-open", group:"A", court:"Campo A", time:"09:00", teamA:"Alfama Ballers", teamB:"Benfica Street Kings", status:"done", scoreA:21, scoreB:17 },
    { id:"g2", category:"masc-open", group:"A", court:"Campo A", time:"09:25", teamA:"Benfica Street Kings", teamB:"Chelas Ballers Crew", status:"done", scoreA:18, scoreB:18 },
    { id:"g3", category:"masc-open", group:"A", court:"Campo A", time:"09:50", teamA:"Chelas Ballers Crew", teamB:"Alfama Ballers", status:"live", scoreA:9, scoreB:11 },
    { id:"g4", category:"masc-open", group:"B", court:"Campo B", time:"09:00", teamA:"Marvila Hoopers", teamB:"Odivelas Runners", status:"done", scoreA:21, scoreB:12 },
    { id:"g5", category:"masc-open", group:"B", court:"Campo B", time:"09:25", teamA:"Odivelas Runners", teamB:"Amadora Flow", status:"scheduled", scoreA:null, scoreB:null },
    { id:"g6", category:"masc-open", group:"B", court:"Campo B", time:"09:50", teamA:"Amadora Flow", teamB:"Marvila Hoopers", status:"scheduled", scoreA:null, scoreB:null },
    { id:"g7", category:"fem-open", group:"A", court:"Campo C", time:"09:00", teamA:"Cascais Wave", teamB:"Sintra Lynx", status:"scheduled", scoreA:null, scoreB:null },
  ],
};
// mutable game list
let games = JSON.parse(JSON.stringify(DB.courtsSchedule));

/* ============== HELPERS ============== */
function standingsFor(category, group){
  const teams = DB.teams.filter(t=>t.category===category && t.group===group);
  const rows = teams.map(t=>({ name:t.name, w:0,l:0,pf:0,pa:0, h2h:{} }));
  games.filter(g=>g.category===category && g.group===group && g.status==="done").forEach(g=>{
    const a = rows.find(r=>r.name===g.teamA), b = rows.find(r=>r.name===g.teamB);
    if(!a||!b) return;
    a.pf+=g.scoreA; a.pa+=g.scoreB; b.pf+=g.scoreB; b.pa+=g.scoreA;
    if(g.scoreA>g.scoreB){a.w++; b.l++;} else if(g.scoreB>g.scoreA){b.w++; a.l++;}
    else { a.h2h[b.name]="tie"; b.h2h[a.name]="tie"; }
  });
  rows.forEach(r=>r.diff=r.pf-r.pa);
  // sort: wins desc, then point diff desc (tie-break), then points for desc
  rows.sort((x,y)=> y.w-x.w || y.diff-x.diff || y.pf-x.pf);
  return rows;
}
function fmtStatus(s){
  return s==="done" ? {label:"Concluído", cls:"bg-[var(--surface-2)] text-[var(--paper-dim)]"}
       : s==="live" ? {label:"Ao vivo", cls:"bg-[var(--red)] text-white"}
       : {label:"Agendado", cls:"bg-[var(--surface-2)] text-[var(--cyan)]"};
}

/* ============== STATE ============== */
let state = { view:"dashboard", publicMode:false, toast:null };

function setState(patch){ state = {...state, ...patch}; render(); }

/* ============== RENDER ============== */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = state.publicMode ? renderPublic() : renderOrganizer();
  bindEvents();
  if(state.toast){
    const t = document.getElementById('toast');
    if(t){ setTimeout(()=>{ state.toast=null; const el=document.getElementById('toast'); if(el) el.remove(); }, 2600); }
  }
}

function shellTop(){
  return `
  <header class="sticky top-0 z-20 border-b" style="padding-top:env(safe-area-inset-top,0px); background:var(--ink); border-color:var(--line);">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style="background:var(--orange);">
          <span class="disp font-bold text-[15px] text-[#1A0D06]">H3</span>
        </div>
        <div class="min-w-0">
          <div class="disp font-semibold text-[15px] leading-tight truncate">HOOPER3</div>
          <div class="text-[11px] text-[var(--paper-dim)] truncate">${state.publicMode ? DB.tournament.name : DB.org.name}</div>
        </div>
      </div>
      <button data-action="toggle-public" class="btn-ghost text-[13px] px-3 py-2 rounded-lg shrink-0">
        ${state.publicMode ? "← Voltar à gestão" : "Ver página pública ↗"}
      </button>
    </div>
  </header>`;
}

function renderOrganizer(){
  const tabs = [
    {k:"dashboard", label:"Painel"},
    {k:"tournament", label:"Torneio"},
    {k:"teams", label:"Equipas"},
    {k:"schedule", label:"Calendário"},
    {k:"live", label:"Check-in & Ao vivo"},
    {k:"standings", label:"Classificações"},
  ];
  return `
  ${shellTop()}
  <div class="max-w-[1400px] mx-auto px-4 sm:px-6 py-5">
    <nav class="flex gap-1 overflow-x-auto scrollbar-thin pb-1 mb-5 -mx-1 px-1">
      ${tabs.map(t=>`<button data-tab="${t.k}" data-active="${state.view===t.k}" class="tab-btn whitespace-nowrap text-[13px] font-medium px-3.5 py-2 rounded-lg">${t.label}</button>`).join("")}
    </nav>
    <div class="fadein">
      ${ state.view==="dashboard" ? viewDashboard()
       : state.view==="tournament" ? viewTournament()
       : state.view==="teams" ? viewTeams()
       : state.view==="schedule" ? viewSchedule()
       : state.view==="live" ? viewLive()
       : viewStandings() }
    </div>
  </div>
  ${toast()}
  `;
}

function toast(){
  if(!state.toast) return "";
  return `<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-30 px-4 py-2.5 rounded-lg text-[13px] font-medium shadow-lg" style="background:${state.toast.kind==='error'?'var(--red)':'var(--cyan)'}; color:#0C1210;">${state.toast.msg}</div>`;
}

/* ---- Dashboard ---- */
function viewDashboard(){
  const total = DB.teams.length;
  const checked = DB.teams.filter(t=>t.checkedIn).length;
  const live = games.filter(g=>g.status==="live").length;
  const done = games.filter(g=>g.status==="done").length;
  return `
  <div class="mb-5">
    <h1 class="disp text-2xl font-semibold mb-1">Olá, ${DB.user.name.split(' ')[0]}</h1>
    <p class="text-[var(--paper-dim)] text-[14px]">${DB.tournament.name} · ${DB.tournament.dates} · ${DB.tournament.local}</p>
  </div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
    ${statCard("Equipas inscritas", total, "")}
    ${statCard("Check-in feito", `${checked}/${total}`, checked<total ? "faltam "+(total-checked) : "completo")}
    ${statCard("Jogos a decorrer", live, live>0 ? "em direto" : "nenhum agora")}
    ${statCard("Jogos concluídos", `${done}/${games.length}`, "")}
  </div>
  <div class="grid md:grid-cols-[1.4fr_1fr] gap-4">
    <div class="card p-4">
      <h2 class="disp font-semibold text-[15px] mb-3">Categorias do torneio</h2>
      <div class="court-rule mb-3"></div>
      <div class="space-y-2">
        ${DB.tournament.categories.map(c=>`
          <div class="flex items-center justify-between py-2 border-b last:border-0" style="border-color:var(--line);">
            <div>
              <div class="text-[14px] font-medium">${c.name}</div>
              <div class="text-[12px] text-[var(--paper-dim)]">${c.format}</div>
            </div>
            <span class="chip" style="background:var(--surface-2); color:var(--paper-dim);">${c.teamsCount} equipas</span>
          </div>`).join("")}
      </div>
    </div>
    <div class="card p-4">
      <h2 class="disp font-semibold text-[15px] mb-3">Próximos jogos</h2>
      <div class="space-y-2">
        ${games.filter(g=>g.status!=="done").slice(0,4).map(g=>`
          <div class="text-[13px] py-2 border-b last:border-0" style="border-color:var(--line);">
            <div class="flex justify-between"><span class="font-medium">${g.teamA} vs ${g.teamB}</span><span class="text-[var(--paper-dim)]">${g.time}</span></div>
            <div class="text-[var(--paper-dim)] text-[12px]">${g.court}</div>
          </div>`).join("")}
      </div>
    </div>
  </div>
  `;
}
function statCard(label,val,sub){
  return `<div class="card p-4">
    <div class="text-[12px] text-[var(--paper-dim)] mb-1.5">${label}</div>
    <div class="disp text-[26px] font-semibold leading-none">${val}</div>
    ${sub?`<div class="text-[11px] text-[var(--cyan)] mt-1.5">${sub}</div>`:""}
  </div>`;
}

/* ---- Tournament setup ---- */
function viewTournament(){
  return `
  <div class="flex items-center justify-between mb-4">
    <h1 class="disp text-xl font-semibold">Configuração do torneio</h1>
    <button class="btn-primary text-[13px] px-3.5 py-2 rounded-lg" data-toast="Nova categoria criada (demo)">+ Nova categoria</button>
  </div>
  <div class="card p-4 mb-4">
    <div class="grid sm:grid-cols-3 gap-4 text-[13px]">
      <div><div class="text-[var(--paper-dim)] mb-1">Nome</div><div class="font-medium">${DB.tournament.name}</div></div>
      <div><div class="text-[var(--paper-dim)] mb-1">Datas</div><div class="font-medium">${DB.tournament.dates}</div></div>
      <div><div class="text-[var(--paper-dim)] mb-1">Local</div><div class="font-medium">${DB.tournament.local}</div></div>
    </div>
  </div>
  <div class="grid md:grid-cols-3 gap-3">
    ${DB.tournament.categories.map(c=>`
      <div class="card p-4">
        <div class="flex items-center justify-between mb-2">
          <span class="chip" style="background:var(--orange-dim); color:#FFB98F;">${c.format}</span>
        </div>
        <div class="disp font-semibold text-[15px] mb-1">${c.name}</div>
        <div class="text-[12px] text-[var(--paper-dim)] mb-3">${c.teamsCount} equipas inscritas</div>
        <div class="flex gap-2">
          <button class="btn-ghost text-[12px] px-2.5 py-1.5 rounded-md flex-1" data-toast="Regras de desempate: nº vitórias → diferença de pontos → pontos marcados">Ver regras</button>
        </div>
      </div>`).join("")}
  </div>
  `;
}

/* ---- Teams ---- */
function viewTeams(){
  return `
  <div class="flex items-center justify-between mb-4">
    <h1 class="disp text-xl font-semibold">Equipas & plantéis</h1>
    <button class="btn-primary text-[13px] px-3.5 py-2 rounded-lg" data-toast="Inscrição de equipa criada (demo)">+ Inscrever equipa</button>
  </div>
  <div class="card overflow-hidden">
    <div class="overflow-x-auto scrollbar-thin">
    <table>
      <thead><tr><th>Equipa</th><th>Categoria</th><th>Grupo</th><th>Plantel</th><th>Check-in</th></tr></thead>
      <tbody>
      ${DB.teams.map(t=>`
        <tr>
          <td class="font-medium">${t.name}</td>
          <td class="text-[var(--paper-dim)]">${DB.tournament.categories.find(c=>c.id===t.category)?.name || t.category}</td>
          <td class="text-[var(--paper-dim)]">Grupo ${t.group}</td>
          <td class="text-[var(--paper-dim)]">${t.players.map(p=>`#${p.num} ${p.n}`).join(", ")}</td>
          <td>${t.checkedIn ? `<span class="chip" style="background:rgba(47,212,196,.15); color:var(--cyan);">Feito</span>` : `<span class="chip" style="background:rgba(255,176,32,.15); color:var(--amber);">Pendente</span>`}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    </div>
  </div>
  `;
}

/* ---- Schedule ---- */
function viewSchedule(){
  const courts = DB.org.courts;
  return `
  <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <h1 class="disp text-xl font-semibold">Calendário de jogos</h1>
    <button id="add-game-btn" class="btn-primary text-[13px] px-3.5 py-2 rounded-lg">+ Agendar jogo (testar conflito)</button>
  </div>
  <p class="text-[13px] text-[var(--paper-dim)] mb-4 max-w-[60ch]">O botão acima simula a criação de um jogo que colide propositadamente com um horário já ocupado no Campo A — a plataforma deteta e bloqueia o conflito antes de guardar.</p>
  <div class="grid md:grid-cols-3 gap-3">
    ${courts.map(court=>`
      <div class="card p-3">
        <div class="disp font-semibold text-[13px] mb-2.5 flex items-center justify-between">
          <span>${court}</span>
          <span class="text-[11px] text-[var(--paper-dim)] font-normal">${games.filter(g=>g.court===court).length} jogos</span>
        </div>
        <div class="space-y-2">
          ${games.filter(g=>g.court===court).sort((a,b)=>a.time.localeCompare(b.time)).map(g=>{
            const st = fmtStatus(g.status);
            return `<div class="p-2.5 rounded-lg" style="background:var(--surface-2);">
              <div class="flex items-center justify-between mb-1">
                <span class="text-[11px] text-[var(--paper-dim)]">${g.time}</span>
                <span class="chip ${st.cls}">${st.label}</span>
              </div>
              <div class="text-[13px] font-medium leading-snug">${g.teamA}</div>
              <div class="text-[11px] text-[var(--paper-dim)] my-0.5">vs</div>
              <div class="text-[13px] font-medium leading-snug">${g.teamB}</div>
              ${g.status==="done" ? `<div class="text-[12px] text-[var(--cyan)] mt-1.5">${g.scoreA} – ${g.scoreB}</div>` : ""}
            </div>`;
          }).join("")}
        </div>
      </div>`).join("")}
  </div>
  `;
}

/* ---- Live ops / check-in ---- */
function viewLive(){
  return `
  <h1 class="disp text-xl font-semibold mb-4">Check-in & operação ao vivo</h1>
  <div class="grid lg:grid-cols-2 gap-5">
    <div class="card p-4">
      <h2 class="disp font-semibold text-[14px] mb-3">Check-in de equipas</h2>
      <div class="space-y-1.5">
        ${DB.teams.map(t=>`
          <div class="flex items-center justify-between py-2 px-1 border-b last:border-0" style="border-color:var(--line);">
            <span class="text-[13px] font-medium">${t.name}</span>
            <button data-checkin="${t.id}" class="chip" style="background:${t.checkedIn?'rgba(47,212,196,.15)':'rgba(255,176,32,.15)'}; color:${t.checkedIn?'var(--cyan)':'var(--amber)'};">
              ${t.checkedIn ? "✓ Confirmado" : "Confirmar chegada"}
            </button>
          </div>`).join("")}
      </div>
    </div>
    <div class="card p-4">
      <h2 class="disp font-semibold text-[14px] mb-3">Jogos a decorrer / por confirmar resultado</h2>
      <div class="space-y-3">
        ${games.filter(g=>g.status!=="done").map(g=>`
          <div class="p-3 rounded-lg" style="background:var(--surface-2);">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[12px] text-[var(--paper-dim)]">${g.court} · ${g.time}</span>
              <span class="chip ${fmtStatus(g.status).cls}">${fmtStatus(g.status).label}</span>
            </div>
            <div class="flex items-center gap-2 text-[13px]">
              <span class="flex-1 font-medium">${g.teamA}</span>
              <input id="score-a-${g.id}" type="number" min="0" value="${g.scoreA ?? ''}" placeholder="–" class="w-14 px-2 py-1.5 text-center text-[13px]">
              <span class="text-[var(--paper-dim)]">–</span>
              <input id="score-b-${g.id}" type="number" min="0" value="${g.scoreB ?? ''}" placeholder="–" class="w-14 px-2 py-1.5 text-center text-[13px]">
              <span class="flex-1 font-medium text-right">${g.teamB}</span>
            </div>
            <button data-confirm="${g.id}" class="btn-primary text-[12px] px-3 py-1.5 rounded-md mt-2.5 w-full">Confirmar resultado</button>
          </div>`).join("")}
      </div>
    </div>
  </div>
  `;
}

/* ---- Standings ---- */
function viewStandings(){
  const cat = DB.tournament.categories[0];
  const groups = [...new Set(DB.teams.filter(t=>t.category==="masc-open").map(t=>t.group))];
  return `
  <h1 class="disp text-xl font-semibold mb-1">Classificações</h1>
  <p class="text-[13px] text-[var(--paper-dim)] mb-4">${cat.name} · desempate: nº de vitórias → diferença de pontos → pontos marcados</p>
  <div class="grid md:grid-cols-2 gap-4">
    ${groups.map(g=>`
      <div class="card overflow-hidden">
        <div class="px-4 py-3 border-b" style="border-color:var(--line);"><span class="disp font-semibold text-[13px]">Grupo ${g}</span></div>
        <table>
          <thead><tr><th>Equipa</th><th>V</th><th>D</th><th>+/-</th></tr></thead>
          <tbody>
          ${standingsFor("masc-open", g).map(r=>`
            <tr><td class="font-medium">${r.name}</td><td>${r.w}</td><td>${r.l}</td><td class="${r.diff>0?'text-[var(--cyan)]':r.diff<0?'text-[var(--red)]':''}">${r.diff>0?'+':''}${r.diff}</td></tr>
          `).join("")}
          </tbody>
        </table>
      </div>`).join("")}
  </div>
  `;
}

/* ---- Public view ---- */
function renderPublic(){
  return `
  ${shellTop()}
  <div class="max-w-[1000px] mx-auto px-4 sm:px-6 py-6">
    <div class="mb-6">
      <h1 class="disp text-2xl font-semibold mb-1">${DB.tournament.name}</h1>
      <p class="text-[13px] text-[var(--paper-dim)]">${DB.tournament.dates} · ${DB.tournament.local}</p>
    </div>
    <div class="grid lg:grid-cols-[1.3fr_1fr] gap-5">
      <div>
        <h2 class="disp font-semibold text-[15px] mb-2.5">Calendário & resultados</h2>
        <div class="space-y-2">
          ${games.sort((a,b)=>a.time.localeCompare(b.time)).map(g=>{
            const st=fmtStatus(g.status);
            return `<div class="card p-3 flex items-center gap-3">
              <div class="w-16 text-[12px] text-[var(--paper-dim)] shrink-0">${g.time}</div>
              <div class="flex-1 min-w-0">
                <div class="text-[13px] font-medium truncate">${g.teamA} <span class="text-[var(--paper-dim)] font-normal">vs</span> ${g.teamB}</div>
                <div class="text-[11px] text-[var(--paper-dim)]">${g.court}</div>
              </div>
              ${g.status==="done" ? `<div class="disp text-[15px] font-semibold shrink-0">${g.scoreA}–${g.scoreB}</div>` : `<span class="chip ${st.cls} shrink-0">${st.label}</span>`}
            </div>`;
          }).join("")}
        </div>
      </div>
      <div>
        <h2 class="disp font-semibold text-[15px] mb-2.5">Classificações — Masculino Open</h2>
        <div class="space-y-3">
          ${["A","B"].map(g=>`
            <div class="card overflow-hidden">
              <div class="px-3.5 py-2.5 border-b" style="border-color:var(--line);"><span class="disp font-semibold text-[12px]">Grupo ${g}</span></div>
              <table>
                <thead><tr><th>Equipa</th><th>V</th><th>D</th></tr></thead>
                <tbody>${standingsFor("masc-open",g).map(r=>`<tr><td class="font-medium">${r.name}</td><td>${r.w}</td><td>${r.l}</td></tr>`).join("")}</tbody>
              </table>
            </div>`).join("")}
        </div>
      </div>
    </div>
  </div>`;
}

/* ============== EVENTS ============== */
function bindEvents(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=> setState({view: el.getAttribute('data-tab')}));
  });
  const pubBtn = document.querySelector('[data-action="toggle-public"]');
  if(pubBtn) pubBtn.addEventListener('click', ()=> setState({publicMode: !state.publicMode, view:"dashboard"}));

  document.querySelectorAll('[data-toast]').forEach(el=>{
    el.addEventListener('click', ()=> setState({toast:{msg: el.getAttribute('data-toast'), kind:"ok"}}));
  });

  document.querySelectorAll('[data-checkin]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.getAttribute('data-checkin'));
      const team = DB.teams.find(t=>t.id===id);
      team.checkedIn = !team.checkedIn;
      render();
    });
  });

  document.querySelectorAll('[data-confirm]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-confirm');
      const g = games.find(x=>x.id===id);
      const a = document.getElementById(`score-a-${id}`).value;
      const b = document.getElementById(`score-b-${id}`).value;
      if(a===""||b===""){ setState({toast:{msg:"Indica o resultado das duas equipas", kind:"error"}}); return; }
      g.scoreA = Number(a); g.scoreB = Number(b); g.status = "done";
      setState({toast:{msg:"Resultado confirmado — classificações atualizadas", kind:"ok"}});
    });
  });

  const addGameBtn = document.getElementById('add-game-btn');
  if(addGameBtn){
    addGameBtn.addEventListener('click', ()=>{
      // simulate trying to book Campo A at 09:00 — already occupied -> conflict
      setState({toast:{msg:"Conflito: Campo A já tem um jogo marcado às 09:00 — escolhe outro horário ou campo", kind:"error"}});
      setTimeout(()=>{
        const firstCard = document.querySelector('.card');
        if(firstCard) firstCard.classList.add('conflict-flash');
      }, 50);
    });
  }
}

render();
</script>
</body>
</html>
